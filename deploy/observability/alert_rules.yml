groups:
  - name: media-manager-api
    rules:
      - alert: MediaManagerHighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, path, method)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 request latency on media-manager API"
          description: "The 95th percentile request latency has been above 2 seconds for 10 minutes."

      - alert: MediaManagerFailedAdminOperations
        expr: increase(http_requests_total{path=~"/api/admin/.*", status_code=~"5.."}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Admin API requests are failing"
          description: "One or more admin endpoints returned 5xx responses in the last 15 minutes."

      - alert: MediaManagerFailureEventSpike
        expr: increase(media_manager_failure_events_total[15m]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Failure event spike detected"
          description: "The application recorded more than 5 failure events in the last 15 minutes."

      - alert: MediaManagerNoSuccessfulOperations
        expr: increase(media_manager_operation_runs_completed_total[6h]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No successful media-manager operations"
          description: "No operation_runs reached COMPLETED in the last 6 hours."
