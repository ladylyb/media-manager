<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Operator Console{% endblock %} · Media Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head_extra %}{% endblock %}
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="mx-auto flex min-h-screen max-w-6xl flex-col px-4 sm:px-6 lg:px-8">
      <header class="flex items-center justify-between border-b border-slate-200 py-4">
        <h1 class="text-lg font-semibold tracking-tight">Media Manager Operator Console</h1>
        <nav aria-label="Primary navigation" class="flex items-center gap-4 text-sm text-slate-600">
          <a class="hover:text-slate-900" href="/">Dashboard</a>
          <a class="hover:text-slate-900" href="/gallery">Gallery</a>
          <a class="hover:text-slate-900" href="/runs">Runs</a>
          <a class="hover:text-slate-900" href="/duplicates">Duplicates</a>
          <a class="hover:text-slate-900" href="/policy">Policy</a>
        </nav>
      </header>

      <main class="flex-1 py-8">
        {% block content %}{% endblock %}
      </main>

      <footer class="border-t border-slate-200 py-4 text-xs text-slate-500">
        <p>Media Manager · Operator Console</p>
      </footer>
    </div>
  </body>
</html>
