{% extends "base.html" %}

{% block title %}Library Detail{% endblock %}

{% block content %}
<section class="mx-auto max-w-6xl px-6 py-8">
  <div class="mb-6 flex items-center justify-between gap-4">
    <div>
      <h2 class="text-2xl font-semibold tracking-tight text-slate-900">Library Detail</h2>
      <p class="mt-1 text-sm text-slate-600">Full preview of selected canonical media.</p>
    </div>
    <a href="/gallery?page={{ return_page }}" class="rounded-md bg-gray-200 px-4 py-2 text-sm font-medium text-slate-800 hover:bg-gray-300">Back to Library</a>
  </div>

  <article class="overflow-hidden rounded-xl bg-white shadow-md ring-1 ring-slate-200">
    {% if item.file_type == "video" %}
      <video controls class="h-[28rem] w-full object-contain bg-black">
        <source src="{{ item.media_url }}" />
      </video>
    {% else %}
      <img src="{{ item.media_url }}" alt="{{ item.filename }}" class="h-[28rem] w-full object-contain bg-slate-100" loading="lazy" />
    {% endif %}

    <div class="space-y-2 px-5 py-4">
      <h3 class="text-lg font-semibold text-slate-900">{{ item.filename }}</h3>
      <p class="break-all font-mono text-xs text-slate-600">{{ item.absolute_path }}</p>
      <div class="pt-1">
        <span class="rounded-full bg-green-100 px-2 py-1 text-xs font-medium text-green-800">Canonical</span>
      </div>
    </div>
  </article>
</section>
{% endblock %}
