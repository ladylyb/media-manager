name: Docs

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Enforce current-only docs links
        run: bash tools/docs/check_no_legacy_links.sh

      - name: Enforce nav-driven docs orphan policy
        run: bash tools/docs/check_orphan_docs.sh
